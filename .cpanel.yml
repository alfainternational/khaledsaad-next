---
# cPanel Git Version Control deployment tasks (run by "Deploy HEAD Commit").
# The repository directory is the application root; the subdomain docroot is ./public.
# PHP/Composer paths are the CloudLinux alt-php 8.3 CLI and cPanel's bundled Composer.
deployment:
  tasks:
    - export DEPLOYPATH=/home/kcepljda/repositories/khaledsaad-next
    - export PHP=/opt/alt/php83/usr/bin/php
    - export COMPOSER=/opt/cpanel/composer/bin/composer
    - cd $DEPLOYPATH && ( [ -f .env ] || cp /home/kcepljda/khaledsaad-next.env .env )
    - cd $DEPLOYPATH && $PHP $COMPOSER install --no-dev --optimize-autoloader --no-interaction --no-progress
    - cd $DEPLOYPATH && $PHP artisan migrate --force --no-interaction
    - cd $DEPLOYPATH && ( [ -f storage/app/.seeded ] || ( $PHP artisan db:seed --force --no-interaction && touch storage/app/.seeded storage/app/.seeded-stage1 storage/app/.seeded-stage2 storage/app/.seeded-stage3 storage/app/.seeded-stage4 storage/app/.seeded-stage4-completion ) )
    - cd $DEPLOYPATH && ( [ -f storage/app/.seeded-stage4 ] || ( $PHP artisan db:seed --class=CompleteAcademySeeder --force --no-interaction && touch storage/app/.seeded-stage4 ) )
    - cd $DEPLOYPATH && ( [ -f storage/app/.seeded-stage4-completion ] || ( $PHP artisan db:seed --class=StageFourCompletionSeeder --force --no-interaction && touch storage/app/.seeded-stage4-completion ) )
    - cd $DEPLOYPATH && ( $PHP artisan storage:link || true )
    - cd $DEPLOYPATH && $PHP artisan optimize:clear && $PHP artisan optimize
    - cd $DEPLOYPATH && chmod -R u+rwX storage bootstrap/cache
