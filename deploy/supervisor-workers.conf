[program:khaledsaad-next-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/khaledsaad-next/current/artisan queue:work redis --sleep=2 --tries=3 --timeout=120 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/khaledsaad-next-worker.log
stopwaitsecs=180
